<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Tale of Two Clouds: Engineering for Accessibility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; padding: 24px;
}
#page-title { color: #555; font-size: 12px; font-weight:400; letter-spacing:.15em; text-transform:uppercase; margin-bottom:10px; }
#player-wrap { position:relative; width:960px; max-width:100%; filter:drop-shadow(0 30px 80px rgba(0,0,0,.7)); }
#canvas-wrap { position:relative; width:960px; height:540px; border-radius:14px 14px 0 0; overflow:hidden; }
canvas { display:block; width:960px; height:540px; }
#start-overlay {
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(0,0,0,.6); backdrop-filter:blur(4px); transition:opacity .4s ease; z-index:10;
}
#start-overlay.hidden { opacity:0; pointer-events:none; }
#start-btn {
  background:linear-gradient(135deg,#22c55e,#16a34a); border:none; color:white; font-family:inherit;
  font-size:18px; font-weight:700; padding:16px 48px; border-radius:50px; cursor:pointer;
  letter-spacing:.05em; box-shadow:0 8px 32px rgba(34,197,94,.4); transition:transform .2s,box-shadow .2s;
}
#start-btn:hover { transform:scale(1.06); }
#start-label { color:rgba(255,255,255,.55); font-size:13px; margin-top:12px; }
#controls {
  background:#151525; border-radius:0 0 14px 14px; padding:12px 20px; display:flex; align-items:center;
  gap:14px; width:960px; max-width:100%; border-top:1px solid #2a2a3e;
}
#play-btn { background:none; border:2px solid #22c55e; color:#22c55e; width:34px; height:34px; border-radius:50%; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; }
#play-btn:hover { background:#22c55e; color:#000; }
#restart-btn { background:none; border:1px solid #444; color:#888; width:28px; height:28px; border-radius:50%; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; }
#restart-btn:hover { border-color:#22c55e; color:#22c55e; }
#timeline-wrap { flex:1; display:flex; flex-direction:column; gap:4px; }
#timeline { width:100%; height:5px; background:#2a2a3e; border-radius:3px; cursor:pointer; position:relative; overflow:hidden; }
#progress-fill { height:100%; background:linear-gradient(90deg,#22c55e,#4ade80); border-radius:3px; width:0%; transition:width .08s linear; pointer-events:none; }
#scene-label { font-size:10px; color:#555; letter-spacing:.05em; }
#time-display { color:#666; font-size:12px; white-space:nowrap; flex-shrink:0; }
</style>
</head>
<body>
<p id="page-title">A Tale of Two Clouds: Engineering for Accessibility</p>
<div id="player-wrap">
  <div id="canvas-wrap">
    <canvas id="canvas" width="960" height="540"></canvas>
    <div id="start-overlay">
      <button id="start-btn">▶ &nbsp; Play Animation</button>
      <p id="start-label">3-minute explainer · AWS vs GCP · Healthcare Accessibility</p>
    </div>
  </div>
  <div id="controls">
    <button id="play-btn">▶</button>
    <div id="timeline-wrap">
      <div id="timeline"><div id="progress-fill"></div></div>
      <div id="scene-label">Act 1 — The Hospital's Dilemma</div>
    </div>
    <span id="time-display">0:00 / 3:00</span>
    <button id="restart-btn">↺</button>
  </div>
</div>
<script>
"use strict";
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const W = 960, H = 540;
const TOTAL  = 180;

// ─── COLORS ─────────────────────────────────────────────────────
const C = {
  bg:       '#b8d8e8',  bgHosp: '#c8e6f0', bgDark: '#8fbfd8',
  bgAWS:    '#fff8f0',  bgGCP:  '#f0f4ff',
  skin:     '#f4a776',  hair:   '#3d2b1f',  hairF: '#8b5e3c',
  shirtB:   '#2563eb',  pantsB: '#374151',  tieB: '#1e3a5f',
  shirtP:   '#7c3aed',  pantsP: '#2c1854',
  shirtG:   '#059669',  pantsG: '#1e3a5f',
  shoe:     '#1a0f2e',
  awsOrange:'#FF9900',  awsDark: '#c67000',
  gcpBlue:  '#4285F4',  gcpRed:  '#EA4335',  gcpYellow:'#FBBC04', gcpGreen:'#34A853',
  green:    '#16a34a',  greenLt: '#d4edda',
  red:      '#dc2626',  redLt:   '#fee2e2',
  blue:     '#2563eb',  blueLt:  '#dbeafe',
  purple:   '#7c3aed',  purpleLt:'#ede9fe',
  white:    '#ffffff',  black:   '#1a1a2e',  gray: '#6b7280',
  gold:     '#f59e0b',  goldLt:  '#fef3c7',
  teal:     '#0d9488',  tealLt:  '#ccfbf1',
};

// ─── MATH ────────────────────────────────────────────────────────
const clamp  = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const lerp   = (a,b,t)   => a+(b-a)*clamp(t,0,1);
const easeOut = t => 1-(1-clamp(t,0,1))**2;
const ease    = t => t<.5?2*t*t:-1+(4-2*t)*t;
const bounce  = t => { t=clamp(t,0,1); if(t<.36) return (t/.36)**2; if(t<.73) return .75+.1875*(1-((t-.545)/.182)**2); return .9375+.0625*(1-((t-.909)/.0909)**2); };
const floatY  = (t,a=8,f=1.5) => Math.sin(t*f*Math.PI*2)*a;
const slide   = (t,d,from,to) => lerp(from,to,easeOut(clamp(t/d,0,1)));

// ─── HELPERS ─────────────────────────────────────────────────────
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function fillBG(color){ ctx.fillStyle=color; ctx.fillRect(0,0,W,H); }
function txt(t,x,y,sz,color,align='center',wt='700'){
  ctx.save(); ctx.fillStyle=color; ctx.font=`${wt} ${sz}px 'Poppins',Arial`;
  ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(t,x,y); ctx.restore();
}
function strokeTxt(t,x,y,sz,fill,stroke,align='center'){
  ctx.save(); ctx.font=`900 ${sz}px 'Poppins',Arial`; ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.strokeStyle=stroke; ctx.lineWidth=5; ctx.strokeText(t,x,y);
  ctx.fillStyle=fill; ctx.fillText(t,x,y); ctx.restore();
}
function badge(x,y,w,h,text,bg,fg,sz=16){
  ctx.fillStyle=bg; rrect(ctx,x,y,w,h,h/2); ctx.fill();
  ctx.fillStyle=fg; ctx.font=`700 ${sz}px 'Poppins',Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,x+w/2,y+h/2);
}
function arrow(x1,y1,x2,y2,color='#333',lw=3,hs=12){
  ctx.save(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw; ctx.lineCap='round';
  const a=Math.atan2(y2-y1,x2-x1), len=Math.hypot(x2-x1,y2-y1);
  ctx.translate(x1,y1); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len-hs,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(len,0); ctx.lineTo(len-hs,-hs*.6); ctx.lineTo(len-hs,hs*.6); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function speechBubble(x,y,w,h,lines,tailDir='right',bg=C.white,fg=C.black,sz=16){
  ctx.save(); ctx.fillStyle=bg; ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1.5;
  rrect(ctx,x,y,w,h,12); ctx.fill(); ctx.stroke();
  const mx=x+w/2, my=y+h*.65;
  if(tailDir==='left'){
    ctx.beginPath(); ctx.moveTo(x+20,my); ctx.lineTo(x-16,my+14); ctx.lineTo(x+8,my+2); ctx.fillStyle=bg; ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(x+w-20,my); ctx.lineTo(x+w+16,my+14); ctx.lineTo(x+w-8,my+2); ctx.fillStyle=bg; ctx.fill();
  }
  const lh=sz*1.4, sy=y+h/2-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>{ ctx.fillStyle=fg; ctx.font=`600 ${sz}px 'Poppins',Arial`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(l,mx,sy+i*lh); });
  ctx.restore();
}
function thoughtBubble(cx,cy,w,h,lines,textColor=C.black,sz=15){
  ctx.save(); ctx.fillStyle='rgba(240,248,255,0.95)'; ctx.strokeStyle='rgba(180,210,230,0.8)'; ctx.lineWidth=2;
  const bumps=[{ox:0,oy:-h*.1,rx:w*.42,ry:h*.38},{ox:-w*.22,oy:h*.1,rx:w*.32,ry:h*.32},{ox:w*.22,oy:h*.1,rx:w*.32,ry:h*.32},{ox:-w*.05,oy:h*.22,rx:w*.35,ry:h*.24}];
  bumps.forEach(b=>{ ctx.beginPath(); ctx.ellipse(cx+b.ox,cy+b.oy,b.rx,b.ry,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); });
  [12,9,6].forEach((r,i)=>{ ctx.beginPath(); ctx.arc(cx-w*.35-i*12,cy+h*.4+i*11,r,0,Math.PI*2); ctx.fill(); ctx.stroke(); });
  const lh=sz*1.4, sy=cy-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>{ ctx.fillStyle=textColor; ctx.font=`700 ${sz}px 'Poppins',Arial`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(l,cx,sy+i*lh); });
  ctx.restore();
}

// ─── CLOUD SERVICE ICONS ─────────────────────────────────────────
function iconS3(cx,cy,size){
  ctx.save(); ctx.translate(cx,cy); const s=size/2;
  ctx.fillStyle=C.awsOrange;
  ctx.beginPath(); ctx.ellipse(0,s*.35,s*.62,s*.18,0,0,Math.PI*2); ctx.fill();
  ctx.fillRect(-s*.62,-s*.35,s*1.24,s*.7);
  ctx.beginPath(); ctx.ellipse(0,-s*.35,s*.62,s*.18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFD08A'; ctx.beginPath(); ctx.ellipse(0,-s*.35,s*.62,s*.18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white'; ctx.font=`900 ${s*.52}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('S3',0,0);
  ctx.restore();
}
function iconRekognition(cx,cy,size,scanT=0){
  ctx.save(); ctx.translate(cx,cy); const s=size/2;
  ctx.fillStyle=C.awsOrange; ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.moveTo(-s*.58,0); ctx.quadraticCurveTo(0,-s*.45,s*.58,0); ctx.quadraticCurveTo(0,s*.45,-s*.58,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle=C.awsDark; ctx.beginPath(); ctx.arc(0,0,s*.24,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C.black; ctx.beginPath(); ctx.arc(0,0,s*.14,0,Math.PI*2); ctx.fill();
  if(scanT>0){ ctx.strokeStyle='rgba(255,153,0,0.85)'; ctx.lineWidth=2.5; const sy=-s*.42+scanT*s*.84; ctx.beginPath(); ctx.moveTo(-s*.5,sy); ctx.lineTo(s*.5,sy); ctx.stroke(); }
  ctx.restore();
}
function iconLambda(cx,cy,size){
  ctx.save(); ctx.translate(cx,cy); const s=size/2;
  ctx.fillStyle=C.awsOrange; rrect(ctx,-s,-s,s*2,s*2,s*.18); ctx.fill();
  ctx.fillStyle='white'; ctx.font=`900 ${s*1.1}px 'Georgia',serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('λ',0,s*.05);
  ctx.restore();
}
function iconPillow(cx,cy,size){
  ctx.save(); ctx.translate(cx,cy); const s=size/2;
  ctx.fillStyle='#3b82f6'; rrect(ctx,-s,-s,s*2,s*2,s*.15); ctx.fill();
  ctx.strokeStyle='white'; ctx.lineWidth=s*.14; ctx.lineCap='round';
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([dx,dy])=>{
    const fx=dx*s*.55, fy=dy*s*.55, a=Math.atan2(dy,dx)+Math.PI;
    ctx.save(); ctx.translate(fx,fy); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s*.32,0); ctx.stroke(); ctx.restore();
  });
  ctx.fillStyle='white'; ctx.font=`bold ${s*.28}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('COMPRESS',0,s*.62);
  ctx.restore();
}
function iconGenAI(cx,cy,size){
  ctx.save(); ctx.translate(cx,cy); const s=size/2;
  ctx.fillStyle=C.purple; rrect(ctx,-s,-s,s*2,s*2,s*.15); ctx.fill();
  ctx.fillStyle='white';
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2, r=i%2===0?s*.52:s*.28;
    ctx.beginPath(); ctx.arc(Math.cos(a)*r,Math.sin(a)*r,s*.1,0,Math.PI*2); ctx.fill();
  }
  ctx.font=`bold ${s*.3}px Arial`; ctx.fillStyle='white'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('GenAI',0,0);
  ctx.restore();
}
function iconGCS(cx,cy,size){
  ctx.save(); ctx.translate(cx,cy); const s=size/2;
  ctx.fillStyle=C.gcpBlue;
  ctx.beginPath(); ctx.arc(-s*.22,s*.05,s*.36,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*.2,-s*.05,s*.46,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*.52,s*.15,s*.28,0,Math.PI*2); ctx.fill();
  ctx.fillRect(-s*.52,s*.1,s*1.08,s*.48);
  ctx.fillStyle='white'; ctx.font=`bold ${s*.32}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('GCS',s*.1,s*.32);
  ctx.restore();
}
function iconGemini(cx,cy,size,t=0){
  ctx.save(); ctx.translate(cx,cy); const s=size/2;
  const cols=[C.gcpBlue,C.gcpGreen,C.gcpYellow,C.gcpRed];
  for(let i=0;i<4;i++){
    const a=(i/4)*Math.PI*2+t*.4;
    ctx.fillStyle=cols[i]; ctx.globalAlpha=0.9;
    ctx.beginPath(); ctx.arc(Math.cos(a)*s*.42,Math.sin(a)*s*.42,s*.36,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(0,0,s*.28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C.black; ctx.font=`bold ${s*.26}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Gemini',0,0);
  ctx.restore();
}
function iconDB(cx,cy,size,color=C.awsOrange,label='DB'){
  ctx.save(); ctx.translate(cx,cy); const s=size/2;
  ctx.fillStyle=color;
  for(let i=0;i<3;i++){
    const y=-s*.38+i*s*.38;
    ctx.beginPath(); ctx.ellipse(0,y-s*.12,s*.62,s*.14,0,0,Math.PI*2); ctx.fill();
    ctx.fillRect(-s*.62,y-s*.12,s*1.24,s*.25);
  }
  ctx.beginPath(); ctx.ellipse(0,s*.38,s*.62,s*.14,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white'; ctx.font=`bold ${s*.35}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label,0,s*.05);
  ctx.restore();
}
function iconMonitor(cx,cy,w,h,contentFn){
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle='#2d3748'; rrect(ctx,-w/2,-h/2,w,h,10); ctx.fill();
  ctx.fillStyle='#1a1a2e'; rrect(ctx,-w/2+8,-h/2+8,w-16,h-32,6); ctx.fill();
  if(contentFn) contentFn(ctx,-w/2+8,-h/2+8,w-16,h-32);
  ctx.fillStyle='#374151'; ctx.fillRect(-8,h/2-8,16,18); rrect(ctx,-22,h/2+10,44,6,3); ctx.fill();
  ctx.restore();
}
function iconTablet(cx,cy,size,contentFn){
  ctx.save(); ctx.translate(cx,cy); const s=size/2;
  ctx.fillStyle='#2d3748'; rrect(ctx,-s*.55,-s,s*1.1,s*2,12); ctx.fill();
  ctx.fillStyle='#1a202c'; rrect(ctx,-s*.44,-s*.88,s*.88,s*1.6,6); ctx.fill();
  if(contentFn) contentFn(ctx,-s*.44,-s*.88,s*.88,s*1.6);
  ctx.fillStyle='#4a5568'; ctx.beginPath(); ctx.arc(0,s*.88,6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ─── MALE CHARACTER (BOB) ────────────────────────────────────────
function drawBob(cx,cy,scale,pose,expr,flipH=false){
  ctx.save(); ctx.translate(cx,cy); if(flipH) ctx.scale(-1,1); ctx.scale(scale,scale);
  const sk=C.skin, hr=C.hair, sh=C.shirtB, pt=C.pantsB, shoe=C.shoe;
  ctx.fillStyle='rgba(0,0,0,0.1)'; ctx.beginPath(); ctx.ellipse(0,148,44,9,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=shoe; ctx.beginPath(); ctx.ellipse(-20,147,18,8,.1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(20,147,18,8,-.1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=pt; rrect(ctx,-33,80,28,72,12); ctx.fill(); rrect(ctx,5,80,28,72,12); ctx.fill();
  ctx.fillStyle=sh; rrect(ctx,-46,15,92,72,18); ctx.fill();
  // Tie
  ctx.fillStyle=C.tieB; ctx.beginPath(); ctx.moveTo(-6,18); ctx.lineTo(6,18); ctx.lineTo(4,80); ctx.lineTo(0,88); ctx.lineTo(-4,80); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2d5da8'; ctx.beginPath(); ctx.moveTo(-6,18); ctx.lineTo(6,18); ctx.lineTo(4,30); ctx.lineTo(-4,30); ctx.closePath(); ctx.fill();
  // Arms
  if(pose==='neutral'||pose==='explaining'||pose==='happy'){
    ctx.fillStyle=sh;
    ctx.save(); ctx.translate(-46,28); ctx.rotate(pose==='happy'?.45:.08); rrect(ctx,-11,0,22,56,11); ctx.fill(); ctx.restore();
    ctx.fillStyle=sk; ctx.beginPath(); ctx.ellipse(-50,pose==='happy'?60:88,12,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=sh;
    ctx.save(); ctx.translate(46,28); ctx.rotate(pose==='happy'?-.45:(pose==='explaining'?-.5:-.08)); rrect(ctx,-11,0,22,56,11); ctx.fill(); ctx.restore();
    ctx.fillStyle=sk;
    if(pose==='explaining'){ ctx.beginPath(); ctx.ellipse(70,10,12,12,0,0,Math.PI*2); ctx.fill(); }
    else { ctx.beginPath(); ctx.ellipse(50,pose==='happy'?60:88,12,12,0,0,Math.PI*2); ctx.fill(); }
  } else if(pose==='thinking'){
    ctx.fillStyle=sh; ctx.save(); ctx.translate(-46,28); ctx.rotate(.08); rrect(ctx,-11,0,22,56,11); ctx.fill(); ctx.restore();
    ctx.fillStyle=sk; ctx.beginPath(); ctx.ellipse(-50,88,12,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=sh; ctx.save(); ctx.translate(46,28); ctx.rotate(-.7); rrect(ctx,-11,0,22,42,11); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(28,10); ctx.rotate(.35); ctx.fillStyle=sh; rrect(ctx,-10,0,20,38,10); ctx.fill(); ctx.restore();
    ctx.fillStyle=sk; ctx.beginPath(); ctx.ellipse(24,-8,12,12,0,0,Math.PI*2); ctx.fill();
  } else if(pose==='pointing_right'){
    ctx.fillStyle=sh; ctx.save(); ctx.translate(-46,28); ctx.rotate(.08); rrect(ctx,-11,0,22,56,11); ctx.fill(); ctx.restore();
    ctx.fillStyle=sk; ctx.beginPath(); ctx.ellipse(-50,88,12,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=sh; ctx.save(); ctx.translate(46,35); ctx.rotate(-.28); rrect(ctx,-11,0,22,56,11); ctx.fill(); ctx.restore();
    ctx.fillStyle=sk; ctx.beginPath(); ctx.ellipse(94,30,12,12,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=sk; ctx.lineWidth=5; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(94,30); ctx.lineTo(110,22); ctx.stroke();
  } else if(pose==='sitting'){
    // Legs forward for sitting
    ctx.fillStyle=pt; rrect(ctx,-33,80,28,50,12); ctx.fill(); rrect(ctx,5,80,28,50,12); ctx.fill();
    ctx.fillStyle=pt; rrect(ctx,-45,120,40,18,8); ctx.fill(); rrect(ctx,5,120,40,18,8); ctx.fill();
    ctx.fillStyle=shoe; ctx.beginPath(); ctx.ellipse(-25,132,17,8,-.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(25,132,17,8,.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=sh; ctx.save(); ctx.translate(-46,28); ctx.rotate(.15); rrect(ctx,-11,0,22,56,11); ctx.fill(); ctx.restore();
    ctx.fillStyle=sk; ctx.beginPath(); ctx.ellipse(-55,85,12,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=sh; ctx.save(); ctx.translate(46,28); ctx.rotate(-.15); rrect(ctx,-11,0,22,56,11); ctx.fill(); ctx.restore();
    ctx.fillStyle=sk; ctx.beginPath(); ctx.ellipse(55,85,12,12,0,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle=sk; rrect(ctx,-15,5,30,18,8); ctx.fill();
  ctx.fillStyle=sk; ctx.beginPath(); ctx.arc(0,-22,38,0,Math.PI*2); ctx.fill();
  // Short professional hair
  ctx.fillStyle=hr;

// ─── DATA PACKET ANIMATION ────────────────────────────────────────
function dataPacket(x,y,color,size=10){
  ctx.save();
  ctx.fillStyle=color; ctx.strokeStyle='white'; ctx.lineWidth=1.5;
  rrect(ctx,x-size/2,y-size/2,size,size,3); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// Animate a packet along path defined by waypoints
function packetAlongPath(waypoints, progress, color, size=10){
  if(!waypoints||waypoints.length<2) return;
  const totalSegments = waypoints.length-1;
  const segProgress = progress * totalSegments;
  const segIdx = Math.min(Math.floor(segProgress), totalSegments-1);
  const segT = segProgress - segIdx;
  const p0 = waypoints[segIdx], p1 = waypoints[segIdx+1];
  const x = lerp(p0[0],p1[0],segT), y = lerp(p0[1],p1[1],segT);
  dataPacket(x,y,color,size);
}

// ─── SERVER/STORAGE BAR CHART ────────────────────────────────────
function drawCapacityChart(x,y,w,h,fillPct,title,t){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.7)'; rrect(ctx,x,y,w,h,8); ctx.fill();
  ctx.fillStyle='#22d3ee'; ctx.font=`bold 11px Arial`; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(title,x+10,y+14);
  const barsData=[{label:'Patients',pct:.92},{label:'Imaging',pct:.88},{label:'Forms',pct:.96},{label:'Reports',pct:.84}];
  const bw=(w-20)/barsData.length-6, bh2=h-45;
  barsData.forEach((b,i)=>{
    const bx=x+10+i*(bw+6), by=y+26, filledH=bh2*b.pct;
    const p=clamp(fillPct,0,1)*b.pct;
    ctx.fillStyle='#1e3a5f'; ctx.fillRect(bx,by,bw,bh2);
    const flashAlt=p>.85&&Math.floor(t*3)%2===0;
    ctx.fillStyle=flashAlt?'#ff0000':(p>.85?'#ef4444':'#22c55e');
    ctx.fillRect(bx,by+bh2-bh2*p,bw,bh2*p);
    ctx.fillStyle='#aaa'; ctx.font=`9px Arial`; ctx.textAlign='center';
    ctx.fillText(b.label,bx+bw/2,by+bh2+10);
  });
  // RED WARNING
  if(fillPct>.8){
    ctx.fillStyle=`rgba(220,38,38,${.4+.3*Math.sin(t*5)})`;
    rrect(ctx,x,y,w,h,8); ctx.fill();
    ctx.fillStyle='#ef4444'; ctx.font=`bold 12px Arial`; ctx.textAlign='center';
    ctx.fillText('⚠ CRITICAL CAPACITY',x+w/2,y+h-12);
  }
  ctx.restore();
}

function flowBox(cx,cy,w,h,label,sublabel,bg,fg,borderColor){

  ctx.restore();

function diamond(cx,cy,w,h,label,bg='#fef3c7',fg='#92400e',border='#f59e0b'){
  ctx.save(); ctx.fillStyle=bg; ctx.strokeStyle=border; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(cx,cy-h/2); ctx.lineTo(cx+w/2,cy); ctx.lineTo(cx,cy+h/2); ctx.lineTo(cx-w/2,cy); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle=fg; ctx.font=`bold 12px 'Poppins',Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,cx,cy);
  ctx.restore();
}

// ─── CONTROLLER ──────────────────────────────────────────────────
let globalTime=0, playing=false, lastTs=null, raf=null;
const progFill=document.getElementById('progress-fill');
const timeDisp=document.getElementById('time-display');
const sceneLbl=document.getElementById('scene-label');
const playBtn=document.getElementById('play-btn');
const restBtn=document.getElementById('restart-btn');
const overlay=document.getElementById('start-overlay');
const startBtn=document.getElementById('start-btn');
const timeline=document.getElementById('timeline');

const fmtT=s=>`${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;

function findScene(t){ for(const s of SCENES) if(t>=s.start&&t<s.end) return s; return SCENES[SCENES.length-1]; }

function render(t){
  ctx.clearRect(0,0,W,H);
  const sc=findScene(t);
  if(sc){ const lt=t-sc.start; try{ sc.draw(ctx,lt,clamp(lt/(sc.end-sc.start),0,1)); }catch(e){ console.warn(e); } }
}

function updateUI(){
  progFill.style.width=(globalTime/TOTAL*100)+'%';
  timeDisp.textContent=`${fmtT(globalTime)} / ${fmtT(TOTAL)}`;
  const sc=findScene(globalTime);
  if(sc) sceneLbl.textContent=`${SCENES.indexOf(sc)+1}/${SCENES.length} — ${sc.label}`;
  playBtn.textContent=playing?'⏸':'▶';
}

function tick(ts){
  if(lastTs!==null&&playing){ const dt=Math.min((ts-lastTs)/1000,.1); globalTime=Math.min(globalTime+dt,TOTAL); }
  lastTs=ts; render(globalTime); updateUI();
  if(globalTime>=TOTAL){ playing=false; updateUI(); lastTs=null; return; }
  raf=requestAnimationFrame(tick);
}

function play(){ if(globalTime>=TOTAL){globalTime=0;lastTs=null;} playing=true; if(!raf) raf=requestAnimationFrame(tick); }
function pause(){ playing=false; lastTs=null; }
function restart(){ globalTime=0; lastTs=null; playing=true; raf=requestAnimationFrame(tick); }

playBtn.addEventListener('click',()=>playing?pause():play());
restBtn.addEventListener('click',restart);
startBtn.addEventListener('click',()=>{ overlay.classList.add('hidden'); play(); });
timeline.addEventListener('click',e=>{
  const r=timeline.getBoundingClientRect();
  globalTime=clamp((e.clientX-r.left)/r.width*TOTAL,0,TOTAL);
  lastTs=null; render(globalTime); updateUI();
});

render(0); updateUI();
</script>
