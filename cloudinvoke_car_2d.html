<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CloudInvoke — Number Plate Detective</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#050810;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Poppins',Arial,sans-serif;padding:24px}
#ptitle{color:#444;font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px}
#wrap{position:relative;width:960px;filter:drop-shadow(0 30px 80px rgba(0,0,0,.8))}
#cw{position:relative;width:960px;height:540px;border-radius:14px 14px 0 0;overflow:hidden}
canvas{display:block;width:960px;height:540px}
#sov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);transition:opacity .4s;z-index:10}
#sov.hidden{opacity:0;pointer-events:none}
#sbtn{background:linear-gradient(135deg,#2563eb,#7c3aed);border:none;color:white;font-family:inherit;font-size:18px;font-weight:700;padding:16px 48px;border-radius:50px;cursor:pointer;box-shadow:0 8px 32px rgba(37,99,235,.5);transition:transform .2s}
#sbtn:hover{transform:scale(1.06)}
#sl{color:rgba(255,255,255,.5);font-size:13px;margin-top:12px}
#ctrl{background:#0d0f1a;border-radius:0 0 14px 14px;padding:12px 20px;display:flex;align-items:center;gap:14px;width:960px;border-top:1px solid #1a2040}
#pb{background:none;border:2px solid #2563eb;color:#2563eb;width:34px;height:34px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
#pb:hover{background:#2563eb;color:#fff}
#rb{background:none;border:1px solid #333;color:#666;width:28px;height:28px;border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
#rb:hover{border-color:#2563eb;color:#2563eb}
#tlw{flex:1;display:flex;flex-direction:column;gap:4px}
#tl{width:100%;height:5px;background:#1a2040;border-radius:3px;cursor:pointer;overflow:hidden}
#pf{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:3px;width:0%;transition:width .08s linear}
#scl{font-size:10px;color:#444;letter-spacing:.05em}
#td{color:#555;font-size:12px;white-space:nowrap;flex-shrink:0}
</style>
</head>
<body>
<p id="ptitle">CloudInvoke — Number Plate Detective · 2D Animation</p>
<div id="wrap">
  <div id="cw">
    <canvas id="canvas" width="960" height="540"></canvas>
    <div id="sov">
      <button id="sbtn">▶ &nbsp; Play Animation</button>
      <p id="sl">2-minute explainer · CloudInvoke AI Enhancement System</p>
    </div>
  </div>
  <div id="ctrl">
    <button id="pb">▶</button>
    <div id="tlw">
      <div id="tl"><div id="pf"></div></div>
      <div id="scl">Scene 1 — Title</div>
    </div>
    <span id="td">0:00 / 2:00</span>
    <button id="rb">↺</button>
  </div>
</div>
<script>
"use strict";
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=960,H=540,TOTAL=120;

// ── PALETTE ──────────────────────────────────────────────────────
const C={
  nightSky:'#070c18',road:'#1a2030',roadLine:'rgba(255,255,255,0.25)',
  building:'#0e1525',buildingLit:'#1e3060',
  carBlue:'#2563eb',carRed:'#dc2626',carGray:'#4b5563',
  police:'#1d4ed8',policeLight1:'#ef4444',policeLight2:'#3b82f6',
  skin:'#f4a776',hairW:'#8b5e3c',hairP:'#1a1a2e',
  shirtW:'#64748b',shirtP:'#1e3a8a',pants:'#1f2937',shoe:'#111',
  brand:'#2563eb',brandPurple:'#7c3aed',brandGlow:'rgba(37,99,235,0.35)',
  spark1:'#ff9900',spark2:'#ffcc00',spark3:'#ff4400',
  plateYellow:'#fbbf24',plateWhite:'#f0f0f0',plateBorder:'#1a1a1a',
  white:'#ffffff',black:'#0d0d0d',gray:'#9ca3af',
  green:'#22c55e',red:'#ef4444',gold:'#f59e0b',
  ui:'#0a1628',uiBorder:'#1e3a8a',uiGlow:'rgba(37,99,235,0.2)',
};

// ── MATH ─────────────────────────────────────────────────────────
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const lerp=(a,b,t)=>a+(b-a)*clamp(t,0,1);
const easeOut=t=>1-(1-clamp(t,0,1))**2;
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const bounce=t=>{t=clamp(t,0,1);if(t<.36)return(t/.36)**2;if(t<.73)return.75+.1875*(1-((t-.545)/.182)**2);return.9375+.0625*(1-((t-.909)/.0909)**2);};
const floatY=(t,a=6,f=1.2)=>Math.sin(t*f*Math.PI*2)*a;
const slide=(t,d,fr,to)=>lerp(fr,to,easeOut(clamp(t/d,0,1)));

// ── DRAW HELPERS ─────────────────────────────────────────────────
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function txt(t,x,y,sz,col,al='center',wt='700'){
  ctx.save();ctx.fillStyle=col;ctx.font=`${wt} ${sz}px 'Poppins',Arial`;
  ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(t,x,y);ctx.restore();
}
function strokeTxt(t,x,y,sz,fill,stroke,al='center'){
  ctx.save();ctx.font=`900 ${sz}px 'Poppins',Arial`;ctx.textAlign=al;ctx.textBaseline='middle';
  ctx.strokeStyle=stroke;ctx.lineWidth=5;ctx.strokeText(t,x,y);
  ctx.fillStyle=fill;ctx.fillText(t,x,y);ctx.restore();
}
function badge(x,y,w,h,text,bg,fg,sz=15){
  ctx.fillStyle=bg;rrect(ctx,x,y,w,h,h/2);ctx.fill();
  ctx.fillStyle=fg;ctx.font=`700 ${sz}px 'Poppins',Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,x+w/2,y+h/2);
}
function glow(cx,cy,r,col,a=.4){
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,col.replace('rgb','rgba').replace(')',`,${a})`)||`rgba(37,99,235,${a})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
}
function arrow(x1,y1,x2,y2,col='#333',lw=3,hs=12){
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';
  const a=Math.atan2(y2-y1,x2-x1),len=Math.hypot(x2-x1,y2-y1);
  ctx.translate(x1,y1);ctx.rotate(a);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(len-hs,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(len,0);ctx.lineTo(len-hs,-hs*.6);ctx.lineTo(len-hs,hs*.6);ctx.closePath();ctx.fill();
  ctx.restore();
}
function speechBubble(x,y,w,h,lines,tailDir='right',bg='white',fg='#111',sz=16){
  ctx.save();ctx.fillStyle=bg;ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;
  rrect(ctx,x,y,w,h,12);ctx.fill();ctx.stroke();
  const ty=y+h*.65;
  if(tailDir==='left'){ctx.beginPath();ctx.moveTo(x+20,ty);ctx.lineTo(x-16,ty+14);ctx.lineTo(x+8,ty+2);ctx.fillStyle=bg;ctx.fill();}
  else{ctx.beginPath();ctx.moveTo(x+w-20,ty);ctx.lineTo(x+w+16,ty+14);ctx.lineTo(x+w-8,ty+2);ctx.fillStyle=bg;ctx.fill();}
  const lh=sz*1.4,sy=y+h/2-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>{ctx.fillStyle=fg;ctx.font=`600 ${sz}px 'Poppins',Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l,x+w/2,sy+i*lh);});
  ctx.restore();
}

// ── NIGHT BACKGROUND ─────────────────────────────────────────────
function drawNightBG(variant='city'){
  // Sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#040810');g.addColorStop(1,'#0d1525');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Stars
  ctx.save();ctx.globalAlpha=.6;
  for(let i=0;i<80;i++){
    const sx=(i*167+13)%W,sy=(i*89+7)%(H*.5),sr=.4+Math.random()*.6;
    ctx.fillStyle='white';ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // Buildings (silhouettes)
  const bldgs=[{x:0,w:80,h:220},{x:90,w:60,h:160},{x:160,w:90,h:280},{x:260,w:50,h:190},
    {x:820,w:90,h:260},{x:860,w:60,h:180},{x:890,w:80,h:320},{x:930,w:30,h:150}];
  bldgs.forEach(b=>{
    ctx.fillStyle=C.building;ctx.fillRect(b.x,H-b.h-80,b.w,b.h);
    // Windows
    ctx.fillStyle='rgba(255,220,100,0.12)';
    for(let r=0;r<Math.floor(b.h/22);r++)for(let c=0;c<Math.floor(b.w/16);c++){
      if(Math.sin(b.x+r*7+c*13)>.3)ctx.fillRect(b.x+c*16+3,H-b.h-78+r*22+3,9,13);
    }
  });
}

// ── ROAD ─────────────────────────────────────────────────────────
function drawRoad(y,w,h){
  ctx.fillStyle=C.road;ctx.fillRect(0,y,W,h);
  // Lane lines
  ctx.fillStyle=C.roadLine;
  for(let x=0;x<W;x+=60)ctx.fillRect(x,y+h/2-3,35,6);
  // Sidewalk edges
  ctx.fillStyle='#252d40';ctx.fillRect(0,y,W,5);ctx.fillRect(0,y+h-5,W,5);
}

// ── CAR ──────────────────────────────────────────────────────────
function drawCar(cx,cy,scale,color,dir='right',damaged=false){
  ctx.save();ctx.translate(cx,cy);if(dir==='left')ctx.scale(-1,1);ctx.scale(scale,scale);
  const bw=135,bh=55,dmg=damaged?.85:1;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(0,bh/2+10,65,12,0,0,Math.PI*2);ctx.fill();
  // Wheels
  [[-45,bh/2+8],[45,bh/2+8]].forEach(([wx,wy])=>{
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(wx,wy,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3d4454';ctx.beginPath();ctx.arc(wx,wy,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#666';ctx.beginPath();ctx.arc(wx,wy,4,0,Math.PI*2);ctx.fill();
  });
  // Body
  ctx.fillStyle=color;
  ctx.save();if(damaged)ctx.transform(1,0,.05,dmg,0,0);
  rrect(ctx,-bw/2,-bh/2,bw,bh,14);ctx.fill();ctx.restore();
  // Cabin
  ctx.fillStyle=color;
  ctx.save();if(damaged)ctx.transform(1,0,.05,dmg,0,0);
  rrect(ctx,-bw*.28,-bh/2-30,bw*.56,32,10);ctx.fill();ctx.restore();
  // Windows
  ctx.fillStyle='rgba(120,200,255,0.55)';
  rrect(ctx,-bw*.25,-bh/2-27,bw*.23,26,5);ctx.fill();
  rrect(ctx,4,-bh/2-27,bw*.22,26,5);ctx.fill();
  // Headlights (glow)
  ctx.fillStyle='#ffffaa';ctx.beginPath();ctx.ellipse(bw/2-5,-7,9,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffffaa';ctx.beginPath();ctx.ellipse(bw/2-5,9,9,5,0,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.shadowColor='#ffff99';ctx.shadowBlur=18;ctx.fillStyle='rgba(255,255,180,.3)';
  ctx.beginPath();ctx.arc(bw/2+5,0,24,0,Math.PI*2);ctx.fill();ctx.restore();
  // Taillights
  ctx.fillStyle='#ff3333';ctx.beginPath();ctx.ellipse(-bw/2+5,-7,8,5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(-bw/2+5,9,8,5,0,0,Math.PI*2);ctx.fill();
  // Number plate
  ctx.fillStyle=C.plateWhite;rrect(ctx,-20,bh/2-16,40,12,2);ctx.fill();
  ctx.fillStyle='#333';ctx.font=`bold 7px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('KA 09',0,bh/2-10);
  ctx.restore();
}

// ── POLICE CAR ───────────────────────────────────────────────────
function drawPoliceCar(cx,cy,scale,t,dir='right'){
  ctx.save();ctx.translate(cx,cy);if(dir==='left')ctx.scale(-1,1);ctx.scale(scale,scale);
  const bw=140,bh=55;
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,bh/2+10,68,12,0,0,Math.PI*2);ctx.fill();
  [[-46,bh/2+8],[46,bh/2+8]].forEach(([wx,wy])=>{
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(wx,wy,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#333';ctx.beginPath();ctx.arc(wx,wy,10,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#1d4ed8';rrect(ctx,-bw/2,-bh/2,bw,bh,14);ctx.fill();
  ctx.fillStyle='#1d4ed8';rrect(ctx,-bw*.28,-bh/2-30,bw*.56,32,10);ctx.fill();
  ctx.fillStyle='rgba(120,200,255,0.55)';
  rrect(ctx,-bw*.25,-bh/2-27,bw*.23,26,5);ctx.fill();
  rrect(ctx,4,-bh/2-27,bw*.22,26,5);ctx.fill();
  // Police stripe
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(-bw/2,-6,bw,12);
  // POLICE text
  ctx.fillStyle='white';ctx.font=`bold 10px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('POLICE',0,0);
  // Light bar
  ctx.fillStyle='#111';rrect(ctx,-30,-bh/2-35,60,10,5);ctx.fill();
  const flash=Math.floor(t*4)%2;
  ctx.fillStyle=flash===0?'#ef4444':'#333';rrect(ctx,-28,-bh/2-33,24,6,3);ctx.fill();
  ctx.fillStyle=flash===1?'#3b82f6':'#333';rrect(ctx,4,-bh/2-33,24,6,3);ctx.fill();
  // Glow from lights
  ctx.save();ctx.globalAlpha=.35;
  ctx.shadowColor=flash===0?'#ef4444':'#3b82f6';ctx.shadowBlur=25;
  ctx.fillStyle=flash===0?'rgba(239,68,68,.5)':'rgba(59,130,246,.5)';
  ctx.beginPath();ctx.arc(0,-bh/2-50,30,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // Headlights
  ctx.fillStyle='#ffffaa';ctx.beginPath();ctx.ellipse(bw/2-5,-7,9,5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bw/2-5,9,9,5,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ── CRASH EFFECT ─────────────────────────────────────────────────
function drawCrash(cx,cy,t,intensity=1){
  if(t<=0)return;
  const pts=24,maxR=120*intensity;
  // Flash
  if(t<0.15){
    ctx.save();ctx.globalAlpha=(1-t/.15)*.7;
    ctx.fillStyle='white';ctx.fillRect(0,0,W,H);ctx.restore();
  }
  // Sparks
  ctx.save();
  for(let i=0;i<pts;i++){
    const angle=(i/pts)*Math.PI*2,speed=30+Math.sin(i*3)*20,
      px=cx+Math.cos(angle)*speed*t*4,py=cy+Math.sin(angle)*speed*t*4;
    const a=Math.max(0,1-t/0.8);
    ctx.globalAlpha=a;
    ctx.fillStyle=i%3===0?C.spark1:(i%3===1?C.spark2:C.spark3);
    ctx.beginPath();ctx.arc(px,py,3+Math.sin(i)*2,0,Math.PI*2);ctx.fill();
    // Trails
    ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();
  }
  // Impact ring
  if(t<0.4){
    const r=t*maxR,a=1-t/.4;
    ctx.globalAlpha=a*.5;ctx.strokeStyle='rgba(255,200,50,0.8)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

// ── CCTV CAMERA ──────────────────────────────────────────────────
function drawCCTV(cx,cy,size,crossed=false){
  ctx.save();ctx.translate(cx,cy);const s=size/2;
  // Pole
  ctx.fillStyle='#555';ctx.fillRect(-3,0,6,s*1.2);
  // Camera body
  ctx.fillStyle='#2d3748';
  ctx.save();ctx.translate(0,-s*.4);ctx.rotate(-.3);
  rrect(ctx,-s*.7,-s*.3,s*1.4,s*.6,s*.15);ctx.fill();
  // Lens
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(s*.45,0,s*.22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(100,200,255,0.4)';ctx.beginPath();ctx.arc(s*.45,0,s*.14,0,Math.PI*2);ctx.fill();
  ctx.restore();
  if(crossed){
    ctx.strokeStyle='#ef4444';ctx.lineWidth=s*.2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-s*.8,-s*.8);ctx.lineTo(s*.8,s*.8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*.8,-s*.8);ctx.lineTo(-s*.8,s*.8);ctx.stroke();
    // Red circle
    ctx.strokeStyle='#ef4444';ctx.lineWidth=s*.1;
    ctx.beginPath();ctx.arc(0,0,s*.9,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

// ── PHONE ────────────────────────────────────────────────────────
function drawPhone(cx,cy,scale,blur=0,showPlate=false,plateText='KA 09 AB 5562'){
  ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
  // Phone body
  ctx.fillStyle='#111827';rrect(ctx,-45,-80,90,160,16);ctx.fill();
  ctx.fillStyle='#1f2937';rrect(ctx,-40,-75,80,150,12);ctx.fill();
  ctx.fillStyle='#0a0e1a';rrect(ctx,-36,-72,72,142,10);ctx.fill();
  // Screen content
  if(showPlate){
    // Number plate on screen
    const px=-32,py=-60,pw=64,ph=42;
    if(blur>0){
      ctx.save();ctx.filter=`blur(${blur}px)`;
      ctx.fillStyle=C.plateYellow;rrect(ctx,px,py,pw,ph,4);ctx.fill();
      ctx.fillStyle=C.plateBorder;ctx.strokeStyle=C.plateBorder;ctx.lineWidth=2;
      rrect(ctx,px,py,pw,ph,4);ctx.stroke();
      ctx.fillStyle='#111';ctx.font=`bold ${blur>2?10:8}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(plateText.split(' ').slice(0,2).join(' '),px+pw/2,py+ph/2-5);
      ctx.fillText(plateText.split(' ').slice(2).join(' '),px+pw/2,py+ph/2+7);
      ctx.filter='none';ctx.restore();
    } else {
      ctx.fillStyle=C.plateYellow;rrect(ctx,px,py,pw,ph,4);ctx.fill();
      ctx.strokeStyle=C.plateBorder;ctx.lineWidth=2;rrect(ctx,px,py,pw,ph,4);ctx.stroke();
      ctx.fillStyle='#111';ctx.font=`bold 9px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(plateText.split(' ').slice(0,2).join(' '),px+pw/2,py+ph/2-5);
      ctx.fillText(plateText.split(' ').slice(2).join(' '),px+pw/2,py+ph/2+7);
    }
    // Rest of scene
    ctx.fillStyle='rgba(30,50,90,0.8)';ctx.fillRect(-32,py+ph,-32,ph/2);
    if(blur>0)txt('BLURRY',0,py+ph+10,8,'#ef4444','center','700');
    else txt('CLEAR',0,py+ph+10,8,'#22c55e','center','700');
  } else {
    ctx.fillStyle='#1e3a5f';rrect(ctx,-32,-68,64,126,8);ctx.fill();
    ctx.fillStyle=C.brand;ctx.font=`bold 8px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('CloudInvoke',0,-20);
  }
  // Home button / indicator
  ctx.fillStyle='#374151';ctx.beginPath();ctx.arc(0,68,7,0,Math.PI*2);ctx.fill();
  // Camera notch
  ctx.fillStyle='#111827';rrect(ctx,-12,-79,24,7,3);ctx.fill();
  ctx.restore();
}

// ── NUMBER PLATE (standalone) ────────────────────────────────────
function drawNumberPlate(cx,cy,w,h,text,blur=0,enhance=0){
  ctx.save();ctx.translate(cx,cy);
  if(blur>0)ctx.filter=`blur(${blur}px)`;
  // Plate bg
  ctx.fillStyle=C.plateYellow;rrect(ctx,-w/2,-h/2,w,h,6);ctx.fill();
  ctx.strokeStyle=C.plateBorder;ctx.lineWidth=3;rrect(ctx,-w/2,-h/2,w,h,6);ctx.stroke();
  // India plate header
  ctx.fillStyle='rgba(0,0,150,0.85)';rrect(ctx,-w/2+3,-h/2+3,w-6,h*.28,3);ctx.fill();
  ctx.fillStyle='white';ctx.font=`bold ${h*.2}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('INDIA',0,-h/2+h*.17);
  // Main text
  ctx.fillStyle='#111';ctx.font=`900 ${h*.35}px 'Courier New',monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,0,h*.1);
  if(blur>0)ctx.filter='none';
  // Enhancement glow
  if(enhance>0){
    ctx.save();ctx.globalAlpha=enhance*.6;
    ctx.shadowColor='#22c55e';ctx.shadowBlur=30*enhance;ctx.strokeStyle='#22c55e';ctx.lineWidth=3;

// ── CONTROLLER ───────────────────────────────────────────────────
let globalTime=0,playing=false,lastTs=null,raf=null;
const pf=document.getElementById('pf'),td=document.getElementById('td');
const scl=document.getElementById('scl'),pb=document.getElementById('pb');
const rb=document.getElementById('rb'),sov=document.getElementById('sov');
const sbtn=document.getElementById('sbtn'),tl=document.getElementById('tl');

const fmtT=s=>`${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
function findScene(t){for(const s of SCENES)if(t>=s.start&&t<s.end)return s;return SCENES[SCENES.length-1];}
function render(t){
  ctx.clearRect(0,0,W,H);
  const sc=findScene(t);
  if(sc)try{sc.draw(ctx,t-sc.start,clamp((t-sc.start)/(sc.end-sc.start),0,1));}catch(e){console.warn(e);}
}
function updateUI(){
  pf.style.width=(globalTime/TOTAL*100)+'%';
  td.textContent=`${fmtT(globalTime)} / ${fmtT(TOTAL)}`;
  const sc=findScene(globalTime);
  if(sc)scl.textContent=`${SCENES.indexOf(sc)+1}/${SCENES.length} — ${sc.label}`;
  pb.textContent=playing?'⏸':'▶';
}
function tick(ts){
  if(lastTs!==null&&playing){const dt=Math.min((ts-lastTs)/1000,.1);globalTime=Math.min(globalTime+dt,TOTAL);}
  lastTs=ts;render(globalTime);updateUI();
  if(globalTime>=TOTAL){playing=false;updateUI();lastTs=null;return;}
  raf=requestAnimationFrame(tick);
}
function play(){if(globalTime>=TOTAL){globalTime=0;lastTs=null;}playing=true;if(!raf)raf=requestAnimationFrame(tick);}
function pause(){playing=false;lastTs=null;}
function restart(){globalTime=0;lastTs=null;playing=true;raf=requestAnimationFrame(tick);}

pb.addEventListener('click',()=>playing?pause():play());
rb.addEventListener('click',restart);
sbtn.addEventListener('click',()=>{sov.classList.add('hidden');play();});
tl.addEventListener('click',e=>{
  const r=tl.getBoundingClientRect();
  globalTime=clamp((e.clientX-r.left)/r.width*TOTAL,0,TOTAL);
  lastTs=null;render(globalTime);updateUI();
});
render(0);updateUI();
</script>
