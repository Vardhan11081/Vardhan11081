<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Processing System — Animated Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
  padding: 24px;
  gap: 0;
}

#page-title {
  color: #666;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

#player-wrap {
  position: relative;
  width: 960px;
  max-width: 100%;
  filter: drop-shadow(0 30px 80px rgba(0,0,0,0.7));
}

#canvas-wrap {
  position: relative;
  width: 960px;
  height: 540px;
  border-radius: 14px 14px 0 0;
  overflow: hidden;
}

canvas {
  display: block;
  width: 960px;
  height: 540px;
}

#start-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  transition: opacity 0.4s ease;
  z-index: 10;
}

#start-overlay.hidden { opacity: 0; pointer-events: none; }

#start-btn {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  border: none;
  color: white;
  font-family: inherit;
  font-size: 18px;
  font-weight: 700;
  padding: 16px 48px;
  border-radius: 50px;
  cursor: pointer;
  letter-spacing: 0.05em;
  box-shadow: 0 8px 32px rgba(34,197,94,0.4);
  transition: transform 0.2s, box-shadow 0.2s;
}
#start-btn:hover { transform: scale(1.06); box-shadow: 0 12px 40px rgba(34,197,94,0.5); }

#start-label {
  color: rgba(255,255,255,0.6);
  font-size: 13px;
  margin-top: 12px;
}

#controls {
  background: #151525;
  border-radius: 0 0 14px 14px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 960px;
  max-width: 100%;
  border-top: 1px solid #2a2a3e;
}

#play-btn {
  background: none;
  border: 2px solid #22c55e;
  color: #22c55e;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
#play-btn:hover { background: #22c55e; color: #000; }

#restart-btn {
  background: none;
  border: 1px solid #444;
  color: #888;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
#restart-btn:hover { border-color: #22c55e; color: #22c55e; }

#timeline-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

#timeline {
  width: 100%;
  height: 5px;
  background: #2a2a3e;
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

#progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #22c55e, #4ade80);
  border-radius: 3px;
  width: 0%;
  transition: width 0.08s linear;
  pointer-events: none;
}

#scene-label {
  font-size: 10px;
  color: #555;
  letter-spacing: 0.05em;
}

#time-display {
  color: #666;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}
</style>
</head>
<body>
<p id="page-title">AI Image Processing System — Animated Explainer Video</p>
<div id="player-wrap">
  <div id="canvas-wrap">
    <canvas id="canvas" width="960" height="540"></canvas>
    <div id="start-overlay">
      <button id="start-btn">▶ &nbsp; Play Animation</button>
      <p id="start-label">2-minute explainer · AI Image Processing System</p>
    </div>
  </div>
  <div id="controls">
    <button id="play-btn" title="Play/Pause">▶</button>
    <div id="timeline-wrap">
      <div id="timeline"><div id="progress-fill"></div></div>
      <div id="scene-label">Scene 1 — Introduction</div>
    </div>
    <span id="time-display">0:00 / 2:00</span>
    <button id="restart-btn" title="Restart">↺</button>
  </div>
</div>

<script>
"use strict";

// ─── CANVAS SETUP ───────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const W = 960, H = 540;
const TOTAL  = 120; // seconds

// ─── COLOR PALETTE ──────────────────────────────────────────────
const C = {
  bg:       '#a8d4e0',
  bgDark:   '#8fc4d5',
  skin:     '#f4a776',
  hair:     '#5c3317',
  shirt:    '#5bb8c1',
  pants:    '#2c1854',
  shoe:     '#1a0f2e',
  green:    '#1a7b3d',
  greenMid: '#2ea04b',
  greenLt:  '#d4edda',
  red:      '#cc2200',
  redLt:    '#ffecec',
  blue:     '#1a5fa0',
  blueLt:   '#dbeafe',
  white:    '#ffffff',
  black:    '#1a1a1a',
  gray:     '#666677',
  bubble:   '#ffffff',
  thought:  '#f0f8ff',
  gold:     '#f5c518',
  ai:       '#7c3aed',
  aiGlow:   'rgba(124,58,237,0.25)',
  orange:   '#ea580c',
};

// ─── MATH HELPERS ───────────────────────────────────────────────
const clamp  = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp   = (a, b, t) => a + (b - a) * clamp(t, 0, 1);
const ease   = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // ease-in-out
const easeOut = t => 1 - (1-clamp(t,0,1)) * (1-clamp(t,0,1));
const easeIn  = t => clamp(t,0,1) * clamp(t,0,1);
const spring  = (t, freq=8, decay=6) => Math.exp(-decay*t) * Math.cos(freq*Math.PI*t);
const bounce  = t => { t = clamp(t,0,1); if(t<0.36) return (t/0.36)**2; if(t<0.73) return 0.75+0.1875*(1-((t-0.545)/0.182)**2); return 0.9375+0.0625*(1-((t-0.909)/0.0909)**2); };

// ─── DRAWING HELPERS ────────────────────────────────────────────
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function pill(ctx, x, y, w, h) { rrect(ctx, x, y, w, h, Math.min(w,h)/2); }

function drawBG(ctx, color, x=0, y=0, w=W, h=H) {
  ctx.fillStyle = color || C.bg;
  ctx.fillRect(x, y, w, h);
}

function fillText(ctx, txt, x, y, size, color, align='center', weight='700', font='Poppins') {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px '${font}', Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, x, y);
  ctx.restore();
}

function strokeText2(ctx, txt, x, y, size, fill, stroke, align='center') {
  ctx.save();
  ctx.font = `900 ${size}px 'Poppins', Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 4;
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(txt, x, y);
  ctx.restore();
}

function speechBubble(ctx, x, y, w, h, text, tailDir='right', tailX=null, color=C.white, textColor=C.black, fontSize=18) {
  const r = 14;
  ctx.save();
  ctx.fillStyle = color;
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 2;
  rrect(ctx, x, y, w, h, r);
  ctx.fill();
  ctx.stroke();
  // Tail
  const tx = tailX !== null ? tailX : (tailDir==='right' ? x+w : x);
  const ty = y + h * 0.65;
  ctx.beginPath();
  if (tailDir === 'right') {
    ctx.moveTo(x+w-25, ty); ctx.lineTo(tx+22, ty+14); ctx.lineTo(x+w-10, ty+2);
  } else if (tailDir === 'left') {
    ctx.moveTo(x+25, ty); ctx.lineTo(tx-22, ty+14); ctx.lineTo(x+10, ty+2);
  } else if (tailDir === 'down') {
    const mx = x + w/2;
    ctx.moveTo(mx-12, y+h); ctx.lineTo(mx, y+h+18); ctx.lineTo(mx+12, y+h);
  }
  ctx.fillStyle = color;
  ctx.fill();
  // Text
  const lines = Array.isArray(text) ? text : [text];
  const lh = fontSize * 1.35;
  const startY = y + h/2 - (lines.length-1)*lh/2;
  lines.forEach((line, i) => {
    ctx.fillStyle = textColor;
    ctx.font = `600 ${fontSize}px 'Poppins', Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(line, x+w/2, startY + i*lh);
  });
  ctx.restore();
}

function thoughtBubble(ctx, cx, cy, w, h, text, textColor=C.black, fontSize=17) {
  ctx.save();
  ctx.fillStyle = C.thought;
  ctx.strokeStyle = '#b8d4e0';
  ctx.lineWidth = 2;
  // Main cloud shape
  const rx = w/2, ry = h/2;
  const bumps = [
    {ox: 0,       oy: -ry*0.1, rx: rx*0.75, ry: ry*0.65},
    {ox: -rx*0.4, oy:  ry*0.1, rx: rx*0.55, ry: ry*0.55},
    {ox:  rx*0.4, oy:  ry*0.1, rx: rx*0.55, ry: ry*0.55},
    {ox: -rx*0.1, oy:  ry*0.35, rx: rx*0.6,  ry: ry*0.4},
  ];
  bumps.forEach(b => {
    ctx.beginPath(); ctx.ellipse(cx+b.ox, cy+b.oy, b.rx, b.ry, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  });
  // Small dots tail (going down-left)
  [14, 10, 7].forEach((r, i) => {
    ctx.beginPath(); ctx.arc(cx - rx*0.55 - i*14, cy + ry*0.55 + i*12, r, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  });
  // Text
  const lines = Array.isArray(text) ? text : [text];
  const lh = fontSize * 1.4;
  const sy = cy - (lines.length-1)*lh/2;
  lines.forEach((line, i) => {
    ctx.fillStyle = textColor;
    ctx.font = `700 ${fontSize}px 'Poppins', Arial, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(line, cx, sy + i*lh);
  });
  ctx.restore();
}

function drawIcon_image(ctx, cx, cy, size, label='IMG', rotation=0) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  const s = size/2;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#aac'; ctx.lineWidth = 2;
  rrect(ctx, -s*0.85, -s, s*1.7, s*1.85, 6);
  ctx.fill(); ctx.stroke();
  // Photo gradient mock
  const g = ctx.createLinearGradient(-s*0.8, -s*0.9, s*0.8, s*0.1);
  g.addColorStop(0, '#a8d4e0'); g.addColorStop(1, '#5bb8c1');
  ctx.fillStyle = g;
  rrect(ctx, -s*0.72, -s*0.9, s*1.44, s*1.1, 4);
  ctx.fill();
  // Sun icon
  ctx.fillStyle = '#f5c518';
  ctx.beginPath(); ctx.arc(-s*0.3, -s*0.55, s*0.22, 0, Math.PI*2); ctx.fill();
  // Mountain
  ctx.fillStyle = '#2c7a2c';
  ctx.beginPath(); ctx.moveTo(-s*0.7, s*0.18); ctx.lineTo(-s*0.15, -s*0.55); ctx.lineTo(s*0.3, s*0.18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a9a3a';
  ctx.beginPath(); ctx.moveTo(s*0.0, s*0.18); ctx.lineTo(s*0.5, -s*0.32); ctx.lineTo(s*0.72, s*0.18); ctx.closePath(); ctx.fill();
  // Label
  ctx.fillStyle = '#666';
  ctx.font = `600 ${s*0.38}px 'Poppins', Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, 0, s*0.75);
  ctx.restore();
}

function drawIcon_ai(ctx, cx, cy, size, glowAmt=0) {
  ctx.save();
  ctx.translate(cx, cy);
  const s = size/2;
  if (glowAmt > 0) {
    ctx.shadowColor = C.ai; ctx.shadowBlur = 30*glowAmt;
  }
  // Outer circle
  ctx.strokeStyle = C.ai; ctx.lineWidth = 3; ctx.fillStyle = '#f5f0ff';
  ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  // Brain circuits
  ctx.strokeStyle = C.ai; ctx.lineWidth = 2.5;
  // Left hemisphere
  ctx.beginPath(); ctx.arc(-s*0.15, -s*0.05, s*0.45, Math.PI*0.55, Math.PI*1.7); ctx.stroke();
  // Right hemisphere
  ctx.beginPath(); ctx.arc(s*0.15, -s*0.05, s*0.45, Math.PI*1.3, Math.PI*2.45); ctx.stroke();
  // Center divider
  ctx.beginPath(); ctx.moveTo(0, -s*0.48); ctx.lineTo(0, s*0.35); ctx.stroke();
  // Brain folds
  [[-s*0.35, -s*0.25], [-s*0.35, s*0.1], [s*0.35, -s*0.25], [s*0.35, s*0.1]].forEach(([bx,by]) => {
    ctx.beginPath(); ctx.arc(bx, by, s*0.13, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(124,58,237,0.15)'; ctx.fill();
  });
  // Dots (neurons)
  [[-s*0.5, -s*0.02],[s*0.5,-s*0.02],[0,-s*0.52],[0,s*0.42]].forEach(([nx,ny]) => {
    ctx.beginPath(); ctx.arc(nx, ny, 5, 0, Math.PI*2);
    ctx.fillStyle = C.ai; ctx.fill();
  });
  ctx.restore();
}

function drawIcon_text(ctx, cx, cy, size) {
  ctx.save(); ctx.translate(cx, cy);
  const s = size/2;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#aac'; ctx.lineWidth = 2;
  rrect(ctx, -s*0.78, -s, s*1.56, s*2, 7); ctx.fill(); ctx.stroke();
  // Lines of text
  [[-s*0.6, -s*0.55, s*1.0], [-s*0.6, -s*0.15, s*0.7],
   [-s*0.6,  s*0.25, s*0.85],[-s*0.6,  s*0.65, s*0.5]].forEach(([lx,ly,lw]) => {
    ctx.fillStyle = '#ccd'; pill(ctx, lx, ly-5, lw, 9); ctx.fill();
  });
  ctx.restore();
}

function drawIcon_magnifier(ctx, cx, cy, size, color=C.ai) {
  ctx.save(); ctx.translate(cx, cy);
  const s = size/2;
  ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(-s*0.1, -s*0.1, s*0.55, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s*0.32, s*0.32); ctx.lineTo(s*0.78, s*0.78); ctx.stroke();
  ctx.restore();
}

function drawIcon_arrow(ctx, x1, y1, x2, y2, color='#333', width=3, headSize=12) {
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  const angle = Math.atan2(y2-y1, x2-x1);
  const len = Math.hypot(x2-x1, y2-y1);
  ctx.translate(x1, y1); ctx.rotate(angle);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len-headSize, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(len, 0); ctx.lineTo(len-headSize, -headSize*0.6);
  ctx.lineTo(len-headSize, headSize*0.6); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawIcon_check(ctx, cx, cy, size, color=C.greenMid) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.strokeStyle = color; ctx.lineWidth = size*0.14; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(-size*0.35, 0); ctx.lineTo(-size*0.05, size*0.35); ctx.lineTo(size*0.38, -size*0.3);
  ctx.stroke(); ctx.restore();
}

function drawIcon_cross(ctx, cx, cy, size, color=C.red) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.strokeStyle = color; ctx.lineWidth = size*0.14; ctx.lineCap='round';
  const r = size*0.35;
  ctx.beginPath(); ctx.moveTo(-r, -r); ctx.lineTo(r, r); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r, -r); ctx.lineTo(-r, r); ctx.stroke();
  ctx.restore();
}

function drawScanLine(ctx, progress, x, y, w, h, color='rgba(124,58,237,0.6)') {
  const yp = y + progress * h;
  ctx.save();
  const grd = ctx.createLinearGradient(x, yp-20, x, yp+20);
  grd.addColorStop(0, 'rgba(124,58,237,0)');
  grd.addColorStop(0.5, color);
  grd.addColorStop(1, 'rgba(124,58,237,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(x, yp-20, w, 40);
  ctx.restore();
}

function drawGlowCircle(ctx, cx, cy, r, color, alpha=0.35) {
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grd.addColorStop(0, color.replace(')', `,${alpha})`).replace('rgb','rgba'));
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
}

// ─── CHARACTER DRAWING ──────────────────────────────────────────
// pose: 'neutral'|'thinking'|'waving'|'pointing'|'happy'|'explaining'
// expr: 'neutral'|'happy'|'worried'|'surprised'
function drawCharacter(ctx, cx, cy, scale, pose, expr, flipH=false) {
  ctx.save();
  ctx.translate(cx, cy);
  if (flipH) ctx.scale(-1, 1);
  ctx.scale(scale, scale);

  const sk=C.skin, hr=C.hair, sh=C.shirt, pt=C.pants, shoe=C.shoe;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(0, 148, 42, 9, 0, 0, Math.PI*2); ctx.fill();

  // Shoes
  ctx.fillStyle = shoe;
  ctx.beginPath(); ctx.ellipse(-19, 147, 17, 8, 0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(19, 147, 17, 8, -0.15, 0, Math.PI*2); ctx.fill();

  // Legs
  ctx.fillStyle = pt;
  rrect(ctx, -32, 80, 26, 72, 12); ctx.fill();
  rrect(ctx, 6,  80, 26, 72, 12); ctx.fill();

  // Body
  ctx.fillStyle = sh;
  rrect(ctx, -42, 18, 84, 72, 20); ctx.fill();

  // Belt line
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(-42, 80, 84, 6);

  // Shirt collar V
  ctx.strokeStyle = '#3a9aaa'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-9, 18); ctx.lineTo(0, 36); ctx.lineTo(9, 18); ctx.stroke();

  // Arms - depends on pose
  if (pose === 'neutral' || pose === 'explaining') {
    // Both arms mostly down, slight angle
    ctx.fillStyle = sh;
    ctx.save(); ctx.translate(-41, 28); ctx.rotate(0.08);
    rrect(ctx, -11, 0, 22, 56, 11); ctx.fill(); ctx.restore();
    ctx.fillStyle = sk;
    ctx.beginPath(); ctx.ellipse(-44, 87, 12, 12, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = sh;
    ctx.save(); ctx.translate(41, 28); ctx.rotate(-0.08);
    rrect(ctx, -11, 0, 22, 56, 11); ctx.fill(); ctx.restore();
    ctx.fillStyle = sk;
    if (pose === 'explaining') {
      // Right hand slightly raised
      ctx.save(); ctx.translate(42, 22); ctx.rotate(-0.5);
      ctx.fillStyle = sh; rrect(ctx, -11, 0, 22, 56, 11); ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.ellipse(65, 10, 12, 12, 0, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(44, 87, 12, 12, 0, 0, Math.PI*2); ctx.fill();
    }
  } else if (pose === 'thinking') {
    // Left arm down
    ctx.fillStyle = sh;
    ctx.save(); ctx.translate(-41, 28); ctx.rotate(0.08);
    rrect(ctx, -11, 0, 22, 56, 11); ctx.fill(); ctx.restore();
    ctx.fillStyle = sk;
    ctx.beginPath(); ctx.ellipse(-44, 87, 12, 12, 0, 0, Math.PI*2); ctx.fill();
    // Right arm bent up to chin
    ctx.fillStyle = sh;
    ctx.save(); ctx.translate(41, 28); ctx.rotate(-0.7);
    rrect(ctx, -11, 0, 22, 42, 11); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(26, 10); ctx.rotate(0.35);
    rrect(ctx, -10, 0, 20, 38, 10); ctx.fill(); ctx.restore();
    ctx.fillStyle = sk;
    ctx.beginPath(); ctx.ellipse(22, -8, 12, 12, 0, 0, Math.PI*2); ctx.fill();
  } else if (pose === 'waving') {
    // Left arm down
    ctx.fillStyle = sh;
    ctx.save(); ctx.translate(-41, 28); ctx.rotate(0.08);

      ctx.beginPath(); ctx.moveTo(78, -14); ctx.lineTo(fx, fy); ctx.stroke();
    });
  } else if (pose === 'pointing') {
    // Left arm down
    ctx.fillStyle = sh;

    ctx.save(); ctx.translate(-41, 28); ctx.rotate(0.45);
    rrect(ctx, -11, 0, 22, 56, 11); ctx.fill(); ctx.restore();

    rrect(ctx, -11, 0, 22, 56, 11); ctx.fill(); ctx.restore();

  ctx.beginPath(); ctx.arc(0, -27, 38, Math.PI, Math.PI*2); ctx.closePath(); ctx.fill();

  // Side hair strands

  ctx.beginPath(); ctx.ellipse(13, -22, 9, 8, 0, 0, Math.PI*2); ctx.fill();

  // Iris
  ctx.fillStyle = '#4a3520';
  ctx.beginPath(); ctx.arc(-13, -21, 5.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -21, 5.5, 0, Math.PI*2); ctx.fill();

  // Pupils
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-12, -20, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(14, -20, 3, 0, Math.PI*2); ctx.fill();

  // Highlights
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(-11, -22, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(15, -22, 1.8, 0, Math.PI*2); ctx.fill();

  // Eyebrows
  ctx.strokeStyle = hr; ctx.lineWidth = 2.8; ctx.lineCap='round';
  if (expr === 'worried') {
    ctx.beginPath(); ctx.moveTo(-22,-35); ctx.quadraticCurveTo(-13,-30,-5,-34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5,-34); ctx.quadraticCurveTo(13,-30,22,-35); ctx.stroke();
  } else if (expr === 'happy' || expr === 'surprised') {
    ctx.beginPath(); ctx.moveTo(-22,-36); ctx.quadraticCurveTo(-13,-40,-5,-36); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5,-36); ctx.quadraticCurveTo(13,-40,22,-36); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-22,-33); ctx.lineTo(-5,-31); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5,-31); ctx.lineTo(22,-33); ctx.stroke();
  }

  // Nose
  ctx.strokeStyle = '#d4885f'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(-3,-13); ctx.quadraticCurveTo(5,-9,3,-13); ctx.stroke();

  // Mouth
  ctx.strokeStyle = '#c96650'; ctx.lineWidth = 2.5; ctx.lineCap='round';
  if (expr === 'happy') {
    ctx.beginPath(); ctx.arc(0,-7,13,0.15,Math.PI-0.15); ctx.stroke();
    // Teeth strip
    ctx.fillStyle = 'white';
    ctx.save(); ctx.beginPath(); ctx.arc(0,-7,12,0.2,Math.PI-0.2); ctx.clip();
    ctx.fillRect(-13,-7,26,8); ctx.restore();
  } else if (expr === 'worried') {
    ctx.beginPath(); ctx.arc(0,-2,10,Math.PI+0.25,-0.25); ctx.stroke();
  } else if (expr === 'surprised') {
    ctx.strokeStyle='none';
    ctx.fillStyle='#c96650';
    ctx.beginPath(); ctx.ellipse(0,-5,6,8,0,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0,-5,11,0.2,Math.PI-0.2); ctx.stroke();
  }

  // Blush
  ctx.fillStyle = 'rgba(255,145,120,0.28)';
  ctx.beginPath(); ctx.ellipse(-25,-10,9,5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(25,-10,9,5,0,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

// ─── SCENE UTILITIES ────────────────────────────────────────────
function fadeAlpha(t, inDur, outStart, outDur=1) {
  if (t < inDur) return ease(t / inDur);
  if (t < outStart) return 1;
  return 1 - ease((t - outStart) / outDur);
}

function slide(t, dur, from, to) {
  return lerp(from, to, easeOut(clamp(t/dur, 0, 1)));
}

// Animated counter / typewriter for a label
function floatY(t, amp=8, freq=1.5) {
  return Math.sin(t * freq * Math.PI * 2) * amp;
}

// Draw tag/label badge
function drawBadge(ctx, x, y, w, h, text, bg, fg, fontSize=18) {
  ctx.save();
  ctx.fillStyle = bg;
  rrect(ctx, x, y, w, h, h/2); ctx.fill();
  ctx.fillStyle = fg;
  ctx.font = `700 ${fontSize}px 'Poppins', Arial`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x+w/2, y+h/2);
  ctx.restore();
}

      ctx.fillStyle = 'rgba(255,255,255,0.6)'; rrect(ctx, imgCX-10, 218, 85, 10, 3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; rrect(ctx, imgCX-10, 236, 95, 10, 3); ctx.fill();

      ctx.restore();

      // Scan line animation
      if (t > 0.8) {
        const scanT = ((t - 0.8) * 0.6) % 1;
        drawScanLine(ctx, scanT, imgCX-120, 170, 240, 200);
        // Glow on edges during scan
        ctx.save(); ctx.globalAlpha = 0.5 + 0.4*Math.sin(t*4);
        ctx.strokeStyle = C.ai; ctx.lineWidth = 2;
        rrect(ctx, imgCX-120, 170, 240, 200, 10); ctx.stroke();
        ctx.restore();
      }

      // Detection boxes appearing
      if (t > 2) {
        const ba = easeOut(clamp((t-2)/0.6, 0, 1));
        ctx.save(); ctx.globalAlpha = ba;
        // Box around text area
        ctx.strokeStyle = C.red; ctx.lineWidth = 2.5; ctx.setLineDash([5,4]);
        ctx.strokeRect(imgCX-8, 192, 116, 58);
        ctx.setLineDash([]);
        // Label
        ctx.fillStyle = C.red; rrect(ctx, imgCX-8, 178, 72, 18, 4); ctx.fill();
        ctx.fillStyle = 'white'; ctx.font='bold 11px Arial'; ctx.textAlign='center';
        ctx.fillText('TEXT AREA', imgCX+28, 189);
        ctx.restore();
      }

      // AI analysis bullets on right
      const bullets = [
        { icon: '🔍', text: 'Scanning image pixels', delay: 1.2 },
        { icon: '🤖', text: 'Running OCR detection', delay: 2.2 },
        { icon: '✅', text: 'Text regions found!',  delay: 3.2 },
      ];
      bullets.forEach((b, i) => {
        if (t < b.delay) return;
        const ba = easeOut(clamp((t-b.delay)/0.6, 0, 1));
        ctx.save(); ctx.globalAlpha = ba;
        const bx = imgCX+155, by = 200 + i*70;
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; rrect(ctx, bx, by, 200, 50, 10); ctx.fill();
        ctx.font = '22px Arial'; ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillText(b.icon, bx+12, by+25);
        ctx.fillStyle = C.black; ctx.font = `600 15px 'Poppins', Arial`; ctx.textAlign='left';
        ctx.fillText(b.text, bx+44, by+25);
        ctx.restore();
      });

      // Binary/code particles bg
      ctx.save(); ctx.globalAlpha = 0.06;
      ctx.fillStyle = C.ai; ctx.font = '11px monospace';
      const bits = ['01','10','AI','ML','1','0','11','00'];
      for (let i = 0; i < 28; i++) {
        const bx = 20 + (i*42 + t*15) % (W-40);
        const by = 30 + (i*71 + t*8) % (H-60);
        ctx.fillText(bits[i%bits.length], bx, by);
      }
      ctx.restore();
    }
  },

  // ════════════════════════════════════════════════════════════
  // SCENE 7: DECISION BRANCH (80-92s)
  // ════════════════════════════════════════════════════════════
  {
    id: 's7', label: 'Intelligent Decision Engine', start: 80, end: 92,
    draw(ctx, t, p) {
      drawBG(ctx, C.bg);

      // Title
      const ta = easeOut(clamp(t/0.8, 0, 1));
      ctx.save(); ctx.globalAlpha = ta;
      fillText(ctx, 'Intelligent Decision Engine', W/2, 50, 32, C.black, 'center', '700');
      ctx.restore();

      // Central AI box (appears immediately)
      {
        const ca = easeOut(clamp(t/0.6, 0, 1));
        ctx.save(); ctx.globalAlpha = ca;
        const pulse = 0.5 + 0.5*Math.sin(t*3);
        ctx.fillStyle = '#e0e7ff'; ctx.strokeStyle = C.ai; ctx.lineWidth = 3;
        rrect(ctx, W/2-80, H/2-55, 160, 110, 16); ctx.fill(); ctx.stroke();
        drawIcon_ai(ctx, W/2, H/2, 90, pulse);
        ctx.restore();
      }

      // Image coming in from left (starts immediately)
      {
        const ix = slide(t, 1.0, 50, W/2-130);
        ctx.save(); ctx.globalAlpha = easeOut(clamp(t/1.0, 0, 1));
        drawIcon_image(ctx, ix, H/2, 90);
        if (t > 1.2) {
          drawIcon_arrow(ctx, ix+50, H/2, W/2-88, H/2, C.ai, 3);
        }
        ctx.restore();
      }

      // "TEXT DETECTED?" diamond question (appears at t > 1.0)
      if (t > 1.0) {
        const qa = easeOut(clamp((t-1.0)/0.7, 0, 1));
        ctx.save(); ctx.globalAlpha = qa;
        // Arrow down from AI box
        drawIcon_arrow(ctx, W/2, H/2+56, W/2, H/2+98, C.ai, 3);
        // Diamond shape
        const dx = W/2, dy = H/2+140, ds=55;
        ctx.fillStyle = '#fff3cd'; ctx.strokeStyle = C.gold; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(dx, dy-ds); ctx.lineTo(dx+ds*1.6, dy); ctx.lineTo(dx, dy+ds); ctx.lineTo(dx-ds*1.6, dy); ctx.closePath();
        ctx.fill(); ctx.stroke();
        fillText(ctx, 'TEXT', dx, dy-14, 16, C.black, 'center', '700');

        ctx.restore();
      }

      // YES branch (right) - appears at t > 1.8
      if (t > 1.8) {
        const ya = easeOut(clamp((t-1.8)/0.8, 0, 1));
        ctx.save(); ctx.globalAlpha = ya;
        const ybx = W/2+155, yby = H/2+140;
        drawIcon_arrow(ctx, W/2+89, H/2+140, ybx, yby, C.green, 3);
        ctx.fillStyle = C.greenLt; ctx.strokeStyle = C.green; ctx.lineWidth = 2.5;
        rrect(ctx, ybx, yby-55, 200, 110, 14); ctx.fill(); ctx.stroke();
        fillText(ctx, '✅  YES', ybx+100, yby-28, 18, C.green, 'center', '700');
        fillText(ctx, 'Enhance Image', ybx+100, yby+2, 16, C.black, 'center', '600');

      if (t > 2.5) {
        const na = easeOut(clamp((t-2.5)/0.8, 0, 1));
        ctx.save(); ctx.globalAlpha = na;
        const nbx = W/2-355, nby = H/2+140;
        drawIcon_arrow(ctx, W/2-89, H/2+140, nbx+200, nby, C.blue, 3);

// ─── ANIMATION CONTROLLER ───────────────────────────────────────
let globalTime = 0;
let playing = false;
let lastTs = null;
let raf = null;

const progressFill = document.getElementById('progress-fill');
const timeDisplay  = document.getElementById('time-display');
const sceneLabel   = document.getElementById('scene-label');
const playBtn      = document.getElementById('play-btn');
const restartBtn   = document.getElementById('restart-btn');
const startOverlay = document.getElementById('start-overlay');
const startBtn     = document.getElementById('start-btn');
const timeline     = document.getElementById('timeline');

function fmtTime(s) {
  const m = Math.floor(s/60), ss = Math.floor(s%60);
  return `${m}:${ss.toString().padStart(2,'0')}`;
}

function findScene(t) {
  for (const sc of SCENES) if (t >= sc.start && t < sc.end) return sc;
  return SCENES[SCENES.length-1];
}

function render(t) {
  ctx.clearRect(0, 0, W, H);
  const sc = findScene(t);
  if (sc) {
    const lt = t - sc.start;
    const lp = lt / (sc.end - sc.start);
    sc.draw(ctx, lt, clamp(lp, 0, 1));
  }
}

function updateUI() {
  const pct = (globalTime / TOTAL) * 100;
  progressFill.style.width = pct + '%';
  timeDisplay.textContent  = `${fmtTime(globalTime)} / ${fmtTime(TOTAL)}`;
  const sc = findScene(globalTime);
  if (sc) sceneLabel.textContent = `Scene ${SCENES.indexOf(sc)+1} — ${sc.label}`;
  playBtn.textContent = playing ? '⏸' : '▶';
}

function tick(ts) {
  if (lastTs !== null && playing) {
    const dt = Math.min((ts - lastTs) / 1000, 0.1);
    globalTime = Math.min(globalTime + dt, TOTAL);
  }
  lastTs = ts;
  try { render(globalTime); } catch(e) { console.warn('Render error:', e); }
  updateUI();
  if (globalTime >= TOTAL) {
    playing = false;
    updateUI();
    lastTs = null;
    return;
  }
  raf = requestAnimationFrame(tick);
}

function play() {
  if (globalTime >= TOTAL) { globalTime = 0; lastTs = null; }
  playing = true;
  if (!raf) raf = requestAnimationFrame(tick);
}
function pause() { playing = false; lastTs = null; }
function restart() { globalTime = 0; lastTs = null; playing = true; raf = requestAnimationFrame(tick); }

playBtn.addEventListener('click', () => { playing ? pause() : play(); });
restartBtn.addEventListener('click', restart);
startBtn.addEventListener('click', () => {
  startOverlay.classList.add('hidden');
  play();
});

timeline.addEventListener('click', e => {
  const rect = timeline.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  globalTime = clamp(ratio * TOTAL, 0, TOTAL);
  lastTs = null;
  render(globalTime);
  updateUI();
});

// Initial frame
render(0);
updateUI();
</script>
